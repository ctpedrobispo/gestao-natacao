<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Natação">
<meta name="format-detection" content="telephone=no">
<title>Natação – Mensalidades</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header id="topo"><h1 id="titulo">Este mês</h1></header>
<main id="conteudo" aria-live="polite"><p class="vazio">Carregando…</p></main>
<nav id="abas" aria-label="Menu">
  <button type="button" data-aba="mes" class="ativa"><span class="ic" aria-hidden="true">📅</span>Este mês</button>
  <button type="button" data-aba="alunos"><span class="ic" aria-hidden="true">👧</span>Alunos</button>
  <button type="button" data-aba="condominios"><span class="ic" aria-hidden="true">🏢</span>Condomínios</button>
  <button type="button" data-aba="ajustes"><span class="ic" aria-hidden="true">⚙️</span>Ajustes</button>
</nav>
<div id="folha" class="folha" hidden><div class="folha-caixa" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="arquivo-backup" accept=".json,application/json" hidden>
<script src="regras.js"></script>
<script src="app.js"></script>
</body>
</html>
